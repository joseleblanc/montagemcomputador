<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Técnico | Telecurso PC</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 550px; width: 90%; }
        h2 { color: #003366; text-align: center; margin-top: 0; }
        .pergunta { margin-top: 20px; margin-bottom: 10px; font-weight: bold; color: #444; }
        .opcao { display: block; background: #f8f9fa; padding: 12px; margin: 8px 0; border: 2px solid #eee; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
        .opcao:hover { border-color: #0056b3; background: #eef4ff; }
        input[type="radio"] { margin-right: 10px; }
        .btn-verificar { width: 100%; background: #003366; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 1rem; }
        .btn-verificar:hover { background: #0056b3; }
        .resultado-tela { display: none; text-align: center; }
    </style>
</head>
<body>

    <div class="quiz-card" id="caixa-quiz">
        <h2 id="titulo-quiz">Desafio de Conhecimento</h2>
        <div id="conteudo-questoes">
            </div>
        <button class="btn-verificar" onclick="verificarRespostas()">Finalizar Desafio</button>
    </div>

    <div class="quiz-card resultado-tela" id="caixa-resultado">
        <h2 id="titulo-res"></h2>
        <p id="texto-res"></p>
        <button class="btn-verificar" id="btn-acao"></button>
    </div>

    <script>
        // BANCO DE DADOS DE TODOS OS MÓDULOS
        const bancoDeDados = {
            "1": [
                { q: "Qual componente é o 'Cérebro' do computador?", opts: ["SSD", "RAM", "Processador (CPU)", "Fonte"], a: 2 },
                { q: "Onde todas as peças se conectam?", opts: ["No Gabinete", "Na Placa-Mãe", "No HD", "Na RAM"], a: 1 },
                { q: "A memória RAM serve para:", opts: ["Arquivos permanentes", "Energia", "Imagens", "Dados temporários"], a: 3 },
                { q: "Peça que não pode ter economia por risco de queima:", opts: ["Gabinete", "Fonte de Alimentação", "Mouse", "Cooler"], a: 1 },
                { q: "O SSD M.2 NVMe é conhecido por:", opts: ["Ser lento", "Alta velocidade", "Substituir a GPU", "Cabo SATA"], a: 1 }
            ],
            "2": [
                { q: "Ferramenta mais utilizada na montagem:", opts: ["Martelo", "Chave Philips", "Chave de Fenda", "Alicate"], a: 1 },
                { q: "Para que servem as luvas antiestáticas?", opts: ["Limpeza", "Aderência", "Proteção de componentes", "Estética"], a: 2 },
                { q: "Onde deve ser aplicada a pasta térmica?", opts: ["Placa-mãe", "Entre CPU e Cooler", "RAM", "Ventoinhas"], a: 1 },
                { q: "A chave de fenda (ponta chata) auxilia em:", opts: ["Parafusar CPU", "Instalar Windows", "Abrir travas específicas", "Energia"], a: 2 }
            ],
            "3": [
                { q: "Qual o principal perigo da Eletricidade Estática (ESD) para o hardware?", opts: ["Dar um choque forte no montador", "Queimar transistores microscópicos invisivelmente", "Fazer o computador gastar mais energia", "Aumentar a velocidade dos fans"], a: 1 },

                { q: "Qual a forma correta de manipular peças como Memória RAM e Placa de Vídeo?", opts: ["Segurar pelos contatos dourados", "Segurar firmemente pelos chips centrais", "Segurar apenas pelas bordas laterais", "Envolver em um pano de lã"], a: 2 },

                { q: "Por que recomendamos apoiar a placa-mãe em cima da sua caixa de papelão?", opts: ["Para a placa não escorregar da mesa", "O papelão é isolante e protege as soldas traseiras", "Para esconder os cabos da fonte", "O papelão ajuda a resfriar o processador"], a: 1 },

                { q: "Qual destas situações representa um GRANDE risco de segurança (ESD)?", opts: ["Trabalhar em uma mesa de madeira", "Usar sapatos com sola de borracha", "Montar o PC descalço sobre um tapete", "Tocar em um metal aterrado antes de começar"], a: 2 }
            ],
            "4": [
                { q: "O que significa a técnica ZIF na instalação do processador?", opts: ["Pressionar com força até ouvir um clique", "Encaixe com zero pressão ou força", "Girar o processador para travar", "Usar ferramentas para apertar o soquete"], a: 1 },

                { q: "Qual detalhe visual garante que o processador está na posição correta no soquete?", opts: ["O código de barras da peça", "A cor da pasta térmica", "O triângulo dourado no canto do chip", "O tamanho dos pinos laterais"], a: 2 },

                { q: "Qual a recomendação ao instalar um cooler que já vem com 'pasta pré-aplicada'?", opts: ["Remover e colocar uma nova", "Colocar mais pasta por cima para garantir", "Não adicionar nenhuma pasta extra", "Lixar a base do cooler antes de usar"], a: 2 },

                { q: "Por que devemos travar os pinos do cooler em ordem cruzada (formato de X)?", opts: ["Para o cabo alcançar o conector", "Para espalhar a pasta térmica de forma uniforme", "Porque os parafusos são diferentes", "Para evitar que a placa-mãe entorte"], a: 1 },

                { q: "O que acontece se você esquecer de ligar o cabo no header 'CPU_FAN'?", opts: ["O processador funciona mais rápido", "O cooler não vai girar e o PC pode desligar por superaquecimento", "O Windows vai apagar todos os arquivos", "A placa de vídeo vai assumir o controle do fan"], a: 1 }
            ],
            //xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
            "5": [
                { q: "Qual a principal vantagem de ativar a tecnologia Dual Channel?", opts: ["Aumentar a capacidade de armazenamento do HD", "Dobrar a largura de banda de comunicação das memórias", "Fazer as memórias brilharem mais forte", "Reduzir o consumo de energia do monitor"], a: 1 },

                { q: "O que impede que você instale uma memória RAM do lado errado no slot?", opts: ["A cor dos slots na placa-mãe", "O tamanho dos parafusos", "Um corte físico (chanfro) descentralizado na memória", "Um aviso sonoro da placa-mãe"], a: 2 },

                { q: "Em uma placa-mãe de 4 slots, quais devem ser usados para 2 pentes de memória (Dual Channel)?", opts: ["Slots 1 e 2 (colados)", "Slots 1 e 3 apenas", "Slots 2 e 4 (pulando um espaço)", "Qualquer slot serve"], a: 2 },

                { q: "Qual o sinal físico de que a memória RAM foi encaixada corretamente?", opts: ["O computador começa a apitar", "Você ouve um 'clique' e a trava lateral fecha sozinha", "A memória esquenta imediatamente", "O Windows abre automaticamente"], a: 1 },

                { q: "O que deve ser feito ANTES de tentar inserir a memória no slot?", opts: ["Passar pasta térmica nos contatos", "Abrir as travas laterais do slot", "Lavar a memória com água", "Parafusar a memória na placa-mãe"], a: 1 }
            ],
            ////////////////////////////////////////////////////////////////////////////////////////////////////////////////
            "6": [
                { q: "Qual peça deve ser instalada no gabinete ANTES da placa-mãe para evitar ter que desmontar tudo depois?", opts: ["A Placa de Vídeo", "O Espelho Traseiro (I/O Shield)", "O HD ou SSD", "O Processador"], a: 1 },

                { q: "Para que servem os espaçadores (Standoffs) dourados que acompanham o gabinete?", opts: ["Para deixar o PC mais bonito", "Para evitar que a placa-mãe encoste no metal e cause curto-circuito", "Para aumentar a velocidade do processador", "Para prender os cabos da fonte"], a: 1 },

                { q: "O que acontece se você parafusar a placa-mãe diretamente na chapa de metal do gabinete?", opts: ["O PC funciona normalmente", "A placa-mãe pode fechar curto-circuito e queimar", "O gabinete fica mais leve", "A temperatura diminui"], a: 1 },

                { q: "Qual a recomendação ao apertar os parafusos de fixação da placa-mãe?", opts: ["Apertar o máximo possível com uma parafusadeira elétrica", "Não usar parafusos, apenas cola quente", "Apertar apenas o suficiente para a placa não se mover, sem forçar", "Deixar os parafusos soltos para a placa respirar"], a: 2 },

                { q: "Qual a ordem correta de montagem aprendida até aqui?", opts: ["Montar tudo dentro do gabinete direto", "Montar CPU/RAM fora, instalar espelho, espaçadores e depois a placa", "Instalar a fonte primeiro e depois o processador dentro do gabinete", "Ligar o PC na tomada antes de colocar no gabinete"], a: 1 }
            ],
            ////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
            "7": [
                { q: "Qual cabo é responsável por alimentar o processador e onde ele se localiza?", opts: ["Cabo de 24 pinos na lateral", "Cabo EPS de 4 ou 8 pinos no topo esquerdo", "Cabo SATA no meio da placa", "Cabo USB no painel frontal"], a: 1 },

                { q: "Para que servem os conectores Power SW e Reset SW?", opts: ["Para aumentar a potência da fonte", "Para ligar e reiniciar o computador pelos botões do gabinete", "Para controlar as ventoinhas RGB", "Para conectar o monitor"], a: 1 },

                { q: "Como saber a posição correta de encaixe dos cabos USB e Áudio Frontal?", opts: ["Pela cor dos fios", "Pela força bruta", "Através dos pinos cegos (faltantes) que servem de guia", "Não existe lado certo"], a: 2 },

                { q: "O que deve ser feito se o botão de ligar do gabinete for pressionado e nada acontecer?", opts: ["Trocar a placa-mãe", "Verificar se os cabos do Painel Frontal (Power SW) foram invertidos ou mal encaixados", "Lavar os cabos com álcool", "Comprar um gabinete novo"], a: 1 },

                { q: "Qual a função do cabo ATX de 24 pinos?", opts: ["Ligar o mouse", "Alimentar os circuitos principais da placa-mãe", "Enviar vídeo para o monitor", "Apenas decorar o PC"], a: 1 }
            ],
            
/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

            "8": [
                { q: "Qual o padrão de armazenamento mais rápido e que é instalado direto na placa-mãe?", opts: ["HD Mecânico", "CD-ROM", "SSD M.2 NVMe", "Disquete"], a: 2 },

                { q: "Quais são os dois cabos necessários para ligar um SSD ou HD do tipo SATA?", opts: ["Energia SATA e Dados SATA", "HDMI e USB", "Cabo de força e Cabo de Som", "Apenas o cabo da fonte"], a: 0 },

                { q: "Qual a posição correta para encaixar um SSD M.2 no slot da placa-mãe?", opts: ["Totalmente reto de cima para baixo", "Em um ângulo de aproximadamente 30 graus", "De lado, forçando a trava lateral", "Não tem posição, ele encaixa de qualquer jeito"], a: 1 },

                { q: "Por que é altamente recomendado instalar o Sistema Operacional (Windows/Linux) em um SSD?", opts: ["Porque o SSD é mais barato", "Porque o SSD é muito mais rápido que o HD, agilizando todo o sistema", "Porque o HD não aceita o Windows", "Porque o SSD não esquenta"], a: 1 },

                { q: "O que deve ser feito para fixar o SSD M.2 após encaixá-lo no slot?", opts: ["Passar fita isolante", "Prender com o parafuso específico da placa-mãe ou trava EZ-Latch", "Usar cola quente", "Deixar solto para ele vibrar livremente"], a: 1 }
            
            ],
            "9": [
                { q: "Em qual slot da placa-mãe a placa de vídeo deve ser instalada preferencialmente?", opts: ["No slot mais baixo possível", "No slot PCI-Express x16 superior (mais perto da CPU)", "Em qualquer slot pequeno (x1)", "No slot de memória RAM"], a: 1 },

                { q: "Qual o procedimento de segurança vital após encaixar a placa de vídeo no slot?", opts: ["Limpar com um pano úmido", "Parafusar a placa no gabinete para suportar o peso", "Ligar o PC imediatamente sem parafusar", "Colocar fita adesiva no slot"], a: 1 },

                { q: "Como se chama o cabo da fonte que alimenta a placa de vídeo?", opts: ["Cabo SATA", "Cabo ATX 24 pinos", "Cabo PCI-E (geralmente 6+2 pinos)", "Cabo EPS de CPU"], a: 2 },

                { q: "O que acontece se você esquecer de conectar os cabos de energia na placa de vídeo?", opts: ["Ela funciona mais devagar", "O PC explode", "O computador liga, mas provavelmente não dará imagem ou pedirá energia na tela", "O monitor queima"], a: 2 },

                { q: "Para que serve a trava plástica no final do slot PCI-Express?", opts: ["Para enfeitar a placa-mãe", "Para garantir que a placa de vídeo não saia do lugar sozinha", "Para aumentar a velocidade da placa", "Para ligar os LEDs da GPU"], a: 1 }
            ],
            "10": [
            { q: "Qual a direção recomendada para o fluxo de ar em um gabinete padrão?", opts: ["Entra por cima e sai por baixo", "Entra pela frente/baixo e sai por trás/cima", "Entra por todos os lados ao mesmo tempo", "Não importa a direção"], a: 1 },

            { q: "Como identificar visualmente para qual lado a ventoinha sopra o ar?", opts: ["Pela cor dos leds", "Pelas setas indicativas na lateral ou pelo suporte do motor", "Pelo peso da ventoinha", "Soprando com a boca"], a: 1 },

            { q: "Onde devem ser conectados os cabos das ventoinhas de gabinete na placa-mãe?", opts: ["No conector CPU_FAN", "Nos conectores SYS_FAN ou CHA_FAN", "No slot de memória RAM", "Direto no cabo de som"], a: 1 },

            { q: "O que acontece se todas as ventoinhas estiverem soprando ar para DENTRO do gabinete?", opts: ["O PC fica muito gelado", "O ar quente fica preso lá dentro e a temperatura sobe", "Aumenta a velocidade da internet", "O gabinete pode explodir"], a: 1 },

            { q: "Para que servem os parafusos de rosca grossa nas ventoinhas?", opts: ["Para prender o processador", "Para fixar a ventoinha no chassi do gabinete sem folgas", "Para furar o metal do gabinete", "Não são usados na ventoinha"], a: 1 }
            ],
            "11": [
                { q: "Qual tecla é mais comummente usada para aceder à BIOS ao ligar o computador?", opts: ["Enter", "Espaço", "DEL ou F2", "Shift + Esc"], a: 2 },

                { q: "Para que serve a função XMP (Intel) ou DOCP (AMD) na BIOS?", opts: ["Para mudar a cor do Windows", "Para fazer a memória RAM funcionar na sua velocidade máxima de fábrica", "Para apagar o disco rígido", "Para ligar o Wi-Fi"], a: 1 },

                { q: "O que deves verificar primeiro na BIOS para garantir que a montagem foi um sucesso?", opts: ["Se a hora está certa", "Se o processador, memória e discos foram reconhecidos", "Se o fundo da tela é bonito", "Se o rato funciona sem fios"], a: 1 },

                { q: "O que indica uma temperatura de CPU acima de 60°C apenas parado na tela da BIOS?", opts: ["Que o PC é muito potente", "Possível erro na instalação do cooler ou falta de pasta térmica", "Que o monitor está muito brilante", "Que o Windows já está instalado"], a: 1 },

                { q: "Qual configuração deves alterar para iniciar a instalação do Windows via Pen Drive?", opts: ["Mudar o brilho da tela", "Alterar a Ordem de Boot (Boot Priority)", "Desligar o teclado", "Aumentar a voltagem da fonte"], a: 1 }
            ],
            "12": [
                { q: "Qual a capacidade mínima recomendada para o pendrive de instalação do Windows?", opts: ["2GB", "4GB", "8GB", "128GB"], a: 2 },

                { q: "Qual opção deve ser escolhida para uma instalação limpa em um SSD novo?", opts: ["Atualização", "Reparar o computador", "Personalizada: Instalar apenas o Windows (avançado)", "Instalação por rede"], a: 2 },

                { q: "O que deve ser feito se você não tiver a chave do produto (serial) durante a instalação?", opts: ["Desligar o PC e desistir", "Clicar em 'Não tenho a chave do produto' e prosseguir", "Digitar qualquer número", "Ligar para a Microsoft"], a: 1 },

                { q: "Qual o padrão de teclado brasileiro mais comum que deve ser selecionado?", opts: ["US International", "Português (Portugal)", "Português (Brasil ABNT2)", "Inglês (Reino Unido)"], a: 2 },

                { q: "Após a instalação do Windows, qual driver é o mais importante baixar manualmente do site do fabricante?", opts: ["Driver da calculadora", "Driver da Placa de Vídeo (GPU)", "Driver do monitor", "Driver do mouse padrão"], a: 1 }
            ]
        };

        // Captura o número do módulo pela URL (ex: quiz.html?modulo=2)
        const urlParams = new URLSearchParams(window.location.search);
        const moduloAtual = urlParams.get('modulo') || "1";
        const perguntas = bancoDeDados[moduloAtual] || [];

        // Ajusta o título da página conforme o módulo
        document.getElementById('titulo-quiz').innerText = `Desafio: Módulo ${moduloAtual}`;

        function carregarQuestoes() {
            const container = document.getElementById('conteudo-questoes');
            container.innerHTML = ""; 

            if (!perguntas.length) {
                container.innerHTML = '<p>Este módulo não possui um desafio cadastrado.</p>';
                const botao = document.querySelector('.btn-verificar');
                botao.innerText = 'Continuar módulo';
                botao.onclick = () => window.location.href = `aulas/aula${moduloAtual}.html?aprovado=true`;
                return;
            }

            perguntas.forEach((p, i) => {
                let html = `<div class="pergunta">${i+1}. ${p.q}</div>`;
                p.opts.forEach((opt, index) => {
                    html += `<label class="opcao">
                                <input type="radio" name="q${i}" value="${index}"> ${opt}
                             </label>`;
                });
                container.innerHTML += html;
            });
        }

        function verificarRespostas() {
            if (!perguntas.length) return;
            let acertos = 0;
            let todasRespondidas = true;

            perguntas.forEach((p, i) => {
                const marcada = document.querySelector(`input[name="q${i}"]:checked`);
                if (marcada) {
                    if (parseInt(marcada.value) === p.a) {
                        acertos++;
                    }
                } else {
                    todasRespondidas = false;
                }
            });

            if (!todasRespondidas) {
                alert("Por favor, responda todas as questões antes de finalizar!");
                return;
            }

            const percentual = Math.round((acertos / perguntas.length) * 100);
            mostrarResultado(percentual);
        }

        function mostrarResultado(nota) {
            document.getElementById('caixa-quiz').style.display = 'none';
            const tela = document.getElementById('caixa-resultado');
            tela.style.display = 'block';

            const titulo = document.getElementById('titulo-res');
            const texto = document.getElementById('texto-res');
            const btn = document.getElementById('btn-acao');

            if (nota >= 60) {
                titulo.innerText = "Mandou bem! 🎉";
                titulo.style.color = "#28a745";
                texto.innerText = `Você acertou ${nota}%. Conhecimento validado!`;
                btn.innerText = "Voltar para a Aula";
                // Redireciona para a aula correspondente com o parâmetro de aprovação
                btn.onclick = () => window.location.href = `aulas/aula${moduloAtual}.html?aprovado=true`;
            } else {
                titulo.innerText = "Não foi dessa vez... ❌";
                titulo.style.color = "#dc3545";
                texto.innerText = `Você acertou ${nota}%. O mínimo necessário é 60%. Revise o conteúdo e tente novamente.`;
                btn.innerText = "Tentar Novamente";
                btn.onclick = () => location.reload();
            }
        }

        // Inicializa o quiz ao carregar a página
        carregarQuestoes();
    </script>
</body>
</html>
