<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso | Telecurso Montagem de PC</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="layout.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="login-container">
        <div class="logo-area">
            <h1>TELECURSO</h1>
            <p id="auth-subtitle">Montagem e Manutenção de computadores</p>
        </div>

        <div class="form-group">
            <label for="email">E-mail do Aluno</label>
            <input type="email" id="email" placeholder="exemplo@email.com">
        </div>

        <div class="form-group">
            <label for="senha">Senha de Acesso</label>
            <input type="password" id="senha" placeholder="••••••••">
        </div>

        <button id="btn-principal" class="btn">ENTRAR NA SALA DE AULA</button>
        
        <button id="btn-toggle" class="btn" onclick="alternarModo()">NÃO TENHO CONTA (CADASTRAR)</button>

        <button id="btn-reset" class="btn" onclick="solicitarReset()">ESQUECI MINHA SENHA</button>

        <div id="mensagem-status"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ityqcemfbdzgsfmyisqc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_p6rMiOpEoL6smdIXgOaclQ_TNK0MwNA';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let modoCadastro = false;
        let acessoEmAndamento = false;

        async function solicitarReset() {
            const email = document.getElementById('email').value.trim();

            if (!email) {
                exibirMensagem("Informe seu e-mail para receber o link de recuperação.", "erro");
                return;
            }

            const btnReset = document.getElementById('btn-reset');
            btnReset.disabled = true;

            const redirectTo = new URL('reset-senha.html', window.location.href).href;
            try {
                const { error } = await _supabase.auth.resetPasswordForEmail(email, { redirectTo });
                if (error) throw error;
                exibirMensagem("Se o e-mail estiver cadastrado, você receberá um link para redefinir a senha.", "sucesso");
            } catch (error) {
                console.error("Erro ao solicitar redefinição:", error);
                exibirMensagem("Não foi possível enviar o link de recuperação. Tente novamente.", "erro");
            } finally {
                btnReset.disabled = false;
            }
        }

        function alternarModo() {
            modoCadastro = !modoCadastro;
            const subtitle = document.getElementById('auth-subtitle');
            const btnPrincipal = document.getElementById('btn-principal');
            const btnToggle = document.getElementById('btn-toggle');

            if (modoCadastro) {
                subtitle.innerText = "CRIAR NOVA CONTA";
                btnPrincipal.innerText = "FINALIZAR CADASTRO";
                btnToggle.innerText = "JÁ TENHO CONTA (LOGAR)";
            } else {
                subtitle.innerText = "Montagem e Manutenção de computadores";
                btnPrincipal.innerText = "ENTRAR NA SALA DE AULA";
                btnToggle.innerText = "NÃO TENHO CONTA (CADASTRAR)";
            }
        }

        async function gerenciarAcesso() {
            if (acessoEmAndamento) return;
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('senha').value;

            if (!email || !password) {
                exibirMensagem("Preencha todos os campos.", "erro");
                return;
            }

            acessoEmAndamento = true;
            document.getElementById('btn-principal').disabled = true;

            try {
                if (modoCadastro) {
                    const { data, error } = await _supabase.auth.signUp({ email, password });
                    if (error) throw error;
                    const { error: perfilError } = await _supabase.from('perfil_alunos').insert([{ email, user_id: data.user?.id, status: 'pendente' }]);
                    if (perfilError) throw perfilError;
                    exibirMensagem("Cadastro realizado! Aguarde a aprovação do admin.", "sucesso");
                } else {
                    const { data: perfil, error: perfilError } = await _supabase
                        .from('perfil_alunos').select('status').eq('email', email).maybeSingle();
                    if (perfilError) throw perfilError;
                    if (!perfil || perfil.status?.toLowerCase() !== 'aprovado') {
                        exibirMensagem("Acesso negado: Conta pendente de aprovação.", "erro");
                        return;
                    }
                    const { error } = await _supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    exibirMensagem("Acesso autorizado! Entrando...", "sucesso");
                    setTimeout(() => window.location.href = "modulos.html", 1000);
                }
            } catch (error) {
                console.error("Erro no acesso:", error);
                exibirMensagem(modoCadastro ? "Não foi possível concluir o cadastro. Tente novamente." : "Erro: E-mail ou senha incorretos.", "erro");
            } finally {
                acessoEmAndamento = false;
                document.getElementById('btn-principal').disabled = false;
            }
        }

        function exibirMensagem(texto, tipo) {
            const statusDiv = document.getElementById('mensagem-status');
            statusDiv.innerText = texto;
            statusDiv.className = tipo;
            statusDiv.style.display = "block";
        }

        document.getElementById('btn-principal').addEventListener('click', gerenciarAcesso);
        
        document.addEventListener('keydown', (e) => {
            if(e.key === 'Enter' && (e.target.id === 'email' || e.target.id === 'senha')) gerenciarAcesso();
        });
    </script>
</body>
</html>
